<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Sistema de Gestión de Productos y Pedidos</title>
</head>

<body>

<h1>Detalle de el producto</h1>

<p>
    <strong>Nombre:</strong>
    {{ productos.nombre }}
</p>

<p>
    <strong>Precio:</strong>
    {{ productos.precio }}
</p>

<p>
    <strong>Stock:</strong>
    {{ productos.stock }}
</p>

<p>
    <strong>Registro:</strong>
    {{ productos.registro }}
</p>

<p>
    <strong>Descripción:</strong>
    {{ productos.descripcion }}
</p>

<br>

<a href="/productos/editar/{{ productos.id }}/">
    Editar
</a>

<br><br>

<a href="/productos/listar/">
    Volver
</a>

</body>

</html>
