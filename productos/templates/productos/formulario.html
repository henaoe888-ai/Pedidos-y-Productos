<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Sistema de Gestión de Productos y Pedidos</title>
</head>

<body>

<h1>Gestión de Productos y Pedidos</h1>

<h2>Registro de productos</h2>

<form method="POST">

    {% csrf_token %}

    <p>
        <label>Nombre:</label><br>
        <input
            type="text"
            name="nombre"
            value="{{ productos.nombre|default:'' }}"
            required
        >
    </p>

    <p>
        <label>Descripción:</label><br>
        <input
            type="text"
            name="descripcion"
            value="{{ productos.descripcion|default:'' }}"
            required
        >
    </p>

    <p>
        <label>Precio:</label><br>
        <input
            type="number"
            name="precio"
            value="{{ productos.precio|default:'' }}"
            required
        >
    </p>

    <p>
        <label>Stock:</label><br>
        <input
            type="number"
            name="stock"
            value="{{ productos.stock|default:'' }}"
            required
        >
    </p>

    <p>
        <label>Registro:</label><br>
        <input
            type="date"
            name="registro"
            value="{{ productos.registro|default:'' }}"
            required
        >
    </p>

    <button type="submit">
        Guardar
    </button>

    <br><br>

    <a href="/productos/listar/">
        Ver productos

    
    |


    <a href="/productos/editar/{{ productos.id }}/">
    Editar producto 
    </a>


    |

    
    <br><br>

</form>
